name: rncp-bc2-v1
x-runtime: &runtime
  image: rncp-bc2:1
  build: {context: ., dockerfile: infra/Dockerfile}
  user: "10001:10001"
  environment: {PYTHONPATH: /project/src, OPENBLAS_NUM_THREADS: "2", OMP_NUM_THREADS: "2", BC2_LLM_BASE_URL: http://ollama:11434, MPLCONFIGDIR: /tmp/matplotlib, PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"}
  volumes: ["./infra:/project/infra:ro","./src:/project/src:ro","./tests:/project/tests:ro","./scripts:/project/scripts:ro","./data:/project/data","./models:/project/models","./exports:/project/exports","./docs:/project/docs","./output:/project/output"]
  networks: [local]
  working_dir: /project
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g
services:
  job:
    <<: *runtime
    profiles: [jobs]
    entrypoint: [python,-m,rncp_bc2.cli]
  tests:
    <<: *runtime
    profiles: [tests]
    entrypoint: [python,-m,pytest,-q,-o,cache_dir=/tmp/pytest-cache,tests/unit]
  dashboard:
    <<: *runtime
    entrypoint: [python,-m,rncp_bc2.dashboard]
    ports: ["127.0.0.1:8052:8052"]
    networks: [local]
    healthcheck:
      test: [CMD,python,-c,"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8052/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  browser-tests:
    image: rncp-bc2-browser:1
    build: {context: infra/browser}
    profiles: [tests]
    entrypoint: [python,tests/integration/browser.py]
    volumes: ["./tests:/project/tests:ro","./docs/evidence/browser:/evidence","./docs/evidence/browser:/reference:ro"]
    networks: [local]
    mem_limit: 1g
  ollama:
    image: ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: [genai]
    environment: {OLLAMA_NO_CLOUD: "true", OLLAMA_NUM_PARALLEL: "1", OLLAMA_MAX_LOADED_MODELS: "1"}
    volumes: ["llm:/root/.ollama"]
    networks: [local]
    mem_limit: 4g
networks:
  local: {}
volumes:
  llm: {}
